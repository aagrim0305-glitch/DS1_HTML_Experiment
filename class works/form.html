<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    
    <fieldset>
        <form action = "C:\Users\aagri\OneDrive\Desktop\Web Designing\class works\responce.html" method = "post"> 
            <label for = "name">user name:</label>
            <input type = "text" name = "name" id = "name" placeholder = "enter your name" required>
            <br>
            <br>
            
            <label for = "password">password:</label>
            <input type = "password" name = "password" id = "password" placeholder = "enter your password" required>
            <br>
            <br>
            <label for = "email">email:</label>
            <input type = "email" name = "email" id = "email" placeholder = "enter your email" required>
            <br>
            <br>
            <label for = "gender">gender:</label>
            <input type = "radio" name = "gender" id = "male" value = "male" required>
            <label for = "male">male</label>
            <input type = "radio" name = "gender" id = "female" value = "female" required>
            <label for = "female">female</label>
            <br>
            <br>
            <label for = "hobbies">hobbies:</label>
            <input type = "checkbox" name = "hobbies" id = "reading" value = "reading">
            <label for = "reading">reading</label>
            <input type = "checkbox" name = "hobbies" id = "writing" value = "writing">
            <label for = "writing">writing</label>
            <input type = "checkbox" name = "hobbies" id = "coding" value = "coding">
            <label for = "coding">coding</label>

            <br>
            <br>
            <label for = "DOB">date of birth:</label>
            <input type = "date" name = "DOB" id = "DOB" required>
            <br>
            <br>
            <label for = "LANGUAGE">language:</label>
            <select name = "LANGUAGE" id = "LANGUAGE" required>
                <option value = "SELECT">SELECT</option>
                <option value = "english">english</option>
                <option value = "spanish">spanish</option>
                <option value = "french">french</option>
            </select>
            
<br>
<br>
        <label for="phone">Telephone Number:</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter your phone number"
               maxlength="10" required>
  <br>
  <br>
  
<label for="address">Address:</label>
<textarea id="address" name="address"
          rows="1" cols="30"
          placeholder="Enter your address"></textarea>
<br>
<br>

<label for="resume">Upload Resume:</label>
<input type="file" id="resume" name="resume"
       accept=".pdf,.doc,.docx" required>
<br>
<br>
            <input type = "submit" value = "submit">
            <input type = "reset" value = "reset">

        </form>
    </fieldset>

</body>
</html>
